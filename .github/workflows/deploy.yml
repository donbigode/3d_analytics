name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_IP }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          # Default do ssh-action é 10min; o rebuild da imagem (deps pesadas +
          # exporting layers no disco lento do Lightsail) passa disso.
          command_timeout: 30m
          script: |
            # Resgate de disco inline, ANTES do deploy.sh.
            #
            # Por que aqui e não só no deploy.sh: o Action executa o
            # deploy.sh que JÁ está no disco do servidor. O `git pull` é a
            # primeira linha dele, então o script se substitui, mas o bash em
            # execução segue no inode antigo até terminar — a versão nova só
            # vale do próximo run em diante. Quando o disco já está cheio,
            # esse "próximo run" nunca chega. Este bloco, por estar no YAML,
            # o GitHub lê do repositório a cada run, então vale já no
            # primeiro. O deploy.sh mantém o mesmo resgate para quem roda
            # ele à mão via SSH; rodar duas vezes é no-op instantâneo.
            #
            # Nunca `--volumes`: frontend_build e caddy_data são volumes
            # nomeados.
            df -h /
            docker builder prune -f --max-used-space 4GB \
              || docker builder prune -f --keep-storage 4GB \
              || docker builder prune -f \
              || echo "aviso: builder prune falhou, seguindo"
            docker image prune -af || echo "aviso: image prune falhou, seguindo"
            df -h /
            /opt/3d-analytics/deploy/deploy.sh
